<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8a7df9" />
    <meta name="description" content="Month Bingo with 16 cells and local storage." />
    <title>Month Bingo</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="installPrompt" class="install-prompt" hidden>
      <div class="install-prompt__icon" aria-hidden="true">⬇</div>
      <div class="install-prompt__content">
        <strong>Install Month Bingo</strong>
        <span>Save the app to your home screen and use it like a regular app.</span>
      </div>
      <div class="install-prompt__actions">
        <button id="installPromptAction" type="button">Install</button>
        <button id="installPromptDismiss" type="button" class="ghost">Later</button>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <p class="eyebrow">Monthly overview</p>
        <h2>Saved boards</h2>
        <ul id="monthList" class="month-list" aria-live="polite"></ul>
      </aside>

      <main class="app-shell">
        <header class="topbar">
          <div>
            <p class="eyebrow">Monthly planner</p>
            <h1>Month Bingo</h1>
          </div>
          <div class="toolbar">
            <label id="monthLabel" for="monthInput">Month</label>
            <input id="monthInput" type="month" />
            <select id="languageSelect" class="language-select" aria-label="Language selector" title="Language">
              <option value="de">DE</option>
              <option value="en">EN</option>
            </select>
            <button id="newBoardButton" type="button" class="secondary">New</button>
            <button id="saveButton" type="button">Save</button>
            <div class="action-pair">
              <button id="exportButton" type="button" class="ghost">Export</button>
              <button id="importButton" type="button" class="ghost">Import</button>
            </div>
            <button id="installButton" type="button" class="install-button" hidden>Install app</button>
            <button id="printButton" type="button" class="ghost">Print / PDF</button>
            <div id="serverModeBadge" class="server-mode-badge" hidden>Server mode active</div>
          </div>
        </header>

        <input id="importFileInput" type="file" accept="application/json,.json" hidden />

        <p id="status" class="status" aria-live="polite"></p>

        <section id="board" class="board" aria-label="Bingo cells"></section>
      </main>
    </div>

    <script src="/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/service-worker.js").catch((error) => {
            console.warn("Service Worker konnte nicht registriert werden:", error);
          });

          navigator.serviceWorker.addEventListener("controllerchange", () => {
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
